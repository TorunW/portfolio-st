<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding budget tracker</title>
<style>
  :root{
    --bg:#F7F1EA; --card:#FFFDFA; --wine:#6B1E2E; --wine-dark:#4A1420;
    --amber:#C08A3E; --ink:#2B2320; --ink-soft:#8A7C72; --line:#E6DACB;
    --sage:#5B7553; --danger:#8C2F3B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    padding:28px 16px 60px;
  }
  .wrap{max-width:480px; margin:0 auto;}
  h1{
    font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;
    font-weight:400; font-size:28px; letter-spacing:0.3px; margin:0 0 6px; text-align:center; color:var(--wine-dark);
  }
  .sub{text-align:center; color:var(--ink-soft); font-size:13px; margin:0 0 14px;}
  .divider{display:block; margin:0 auto 22px;}
  .stats{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:10px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 8px; text-align:center;}
  .stat .label{font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px;}
  .stat .value{font-family:Georgia,serif; font-size:19px;}
  .stat.budget input{
    width:100%; border:none; background:transparent; text-align:center;
    font-family:Georgia,serif; font-size:19px; color:var(--ink); padding:0;
  }
  .stat.budget input:focus{outline:none;}
  .stat.remaining.pos .value{color:var(--sage);}
  .stat.remaining.neg .value{color:var(--danger);}
  .bar-track{height:6px; background:var(--line); border-radius:4px; overflow:hidden; margin:0 0 24px;}
  .bar-fill{height:100%; background:var(--wine); transition:width .3s ease;}
  .bar-fill.over{background:var(--danger);}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px;}
  .card h2{font-family:Georgia,serif; font-weight:400; font-size:16px; margin:0 0 12px; color:var(--wine-dark);}
  .form-row{display:flex; gap:8px; margin-bottom:8px;}
  .form-row input, .form-row select{
    flex:1; min-width:0; border:1px solid var(--line); border-radius:8px; padding:9px 10px;
    font-size:14px; font-family:inherit; background:#fff; color:var(--ink);
  }
  .form-row input:focus, .form-row select:focus{outline:none; border-color:var(--wine);}
  button.add{
    width:100%; background:var(--wine); color:#fff; border:none; border-radius:8px;
    padding:10px; font-size:14px; font-family:inherit; cursor:pointer; margin-top:4px;
  }
  button.add:hover{background:var(--wine-dark);}
  .expense{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .expense:last-child{border-bottom:none;}
  .expense .item{font-size:14px;}
  .expense .cat{
    display:inline-block; font-size:10px; color:var(--wine-dark); background:#F1E4E8;
    border-radius:20px; padding:2px 8px; margin-top:3px;
  }
  .expense .date{font-size:10px; color:var(--ink-soft); margin-left:6px;}
  .expense .amt{font-family:Georgia,serif; font-size:15px; white-space:nowrap;}
  .expense .del{background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:15px; padding:4px;}
  .expense .del:hover{color:var(--danger);}
  .empty{color:var(--ink-soft); font-size:13px; text-align:center; padding:12px 0;}
  .reset{display:block; text-align:center; color:var(--ink-soft); font-size:12px; margin:20px auto 0; cursor:pointer; text-decoration:underline; background:none; border:none;}
  .loading{text-align:center; color:var(--ink-soft); font-size:13px; padding:40px 0;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Loading your budget…</div>
</div>

<script>
const STORAGE_KEY = 'wedding-budget-data';
const CATEGORIES = ['Venue','Catering','Decor & fabric','Attire','Flowers','Photography','Music & DJ','Stationery','Favors','Other'];

let data = { totalBudget: 0, expenses: [] };

const SEED_BUDGET = 2600;
const SEED_EXPENSES = [
  { id: 'seed-tulle', item: 'Tulle fabric (10 rolls)', category: 'Decor & fabric', amount: 100 },
  { id: 'seed-flowers', item: 'Flowers', category: 'Flowers', amount: 250 },
  { id: 'seed-cake', item: 'Cake (estimate)', category: 'Catering', amount: 500 },
  { id: 'seed-furs', item: 'Fake furs (6 pcs)', category: 'Decor & fabric', amount: 60 },
  { id: 'seed-antlers', item: 'Reindeer antlers (decor)', category: 'Decor & fabric', amount: 210 },
  { id: 'seed-silver', item: 'Silver decor items', category: 'Decor & fabric', amount: 57 },
];

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) data = JSON.parse(raw);
  } catch (e) {
    // nothing stored yet — fine, we start from the empty default above
  }
  let changed = false;
  const existingIds = new Set(data.expenses.map(x => String(x.id)));
  SEED_EXPENSES.forEach(s => {
    if (!existingIds.has(s.id)) {
      data.expenses.push({ ...s, date: new Date().toISOString().slice(0,10) });
      changed = true;
    }
  });
  if (!data.totalBudget) { data.totalBudget = SEED_BUDGET; changed = true; }
  if (changed) save();
  render();
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.error('Storage error:', e);
  }
}

function fmt(n) {
  return '€' + Number(n || 0).toLocaleString('de-DE', {minimumFractionDigits:0, maximumFractionDigits:2});
}

function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-GB', {day:'numeric', month:'short'});
}

function computeTotals() {
  const spent = data.expenses.reduce((s,e)=>s+Number(e.amount||0),0);
  const remaining = Number(data.totalBudget||0) - spent;
  const pct = data.totalBudget > 0 ? Math.min(100,(spent/data.totalBudget)*100) : 0;
  return { spent, remaining, pct, over: remaining < 0 };
}

function updateStats() {
  const { spent, remaining, pct, over } = computeTotals();
  document.getElementById('stat-spent').textContent = fmt(spent);
  document.getElementById('stat-remaining').textContent = fmt(remaining);
  document.getElementById('stat-remaining-wrap').className = 'stat remaining ' + (over ? 'neg' : 'pos');
  const bar = document.getElementById('bar-fill');
  bar.style.width = pct + '%';
  bar.className = 'bar-fill' + (over ? ' over' : '');
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

function render() {
  const { spent, remaining, pct, over } = computeTotals();

  const rows = data.expenses.slice().reverse().map(e => `
    <div class="expense">
      <div>
        <div class="item">${escapeHtml(e.item)}</div>
        <span class="cat">${escapeHtml(e.category)}</span><span class="date">${fmtDate(e.date)}</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <div class="amt">${fmt(e.amount)}</div>
        <button class="del" onclick="removeExpense('${e.id}')" aria-label="Delete expense">✕</button>
      </div>
    </div>
  `).join('') || '<div class="empty">No expenses yet — add your first one below.</div>';

  document.getElementById('app').innerHTML = `
    <h1>Wedding budget</h1>
    <p class="sub">Track what you've spent and what's left to plan</p>
    <svg class="divider" width="140" height="14" viewBox="0 0 140 14" aria-hidden="true">
      <path d="M0,4 Q17.5,14 35,4 T70,4 T105,4 T140,4" fill="none" stroke="#6B1E2E" stroke-width="1"/>
    </svg>

    <div class="stats">
      <div class="stat budget">
        <div class="label">Budget</div>
        <input type="number" min="0" step="1" value="${data.totalBudget || ''}" placeholder="0"
          oninput="onBudgetInput(this.value)" onchange="onBudgetChange(this.value)">
      </div>
      <div class="stat">
        <div class="label">Spent</div>
        <div class="value" id="stat-spent">${fmt(spent)}</div>
      </div>
      <div class="stat remaining ${over ? 'neg':'pos'}" id="stat-remaining-wrap">
        <div class="label">Remaining</div>
        <div class="value" id="stat-remaining">${fmt(remaining)}</div>
      </div>
    </div>
    <div class="bar-track"><div class="bar-fill ${over?'over':''}" id="bar-fill" style="width:${pct}%"></div></div>

    <div class="card">
      <h2>Add an expense</h2>
      <div class="form-row">
        <input type="text" id="in-item" placeholder="What is it?" onkeydown="if(event.key==='Enter') document.getElementById('in-amt').focus()">
      </div>
      <div class="form-row">
        <select id="in-cat">${CATEGORIES.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}</select>
        <input type="number" id="in-amt" placeholder="€" min="0" step="0.01" style="max-width:100px;" onkeydown="if(event.key==='Enter') addExpense()">
      </div>
      <button class="add" onclick="addExpense()">Add expense</button>
    </div>

    <div class="card">
      <h2>Expenses</h2>
      ${rows}
    </div>

    <button class="reset" onclick="resetAll()">Clear all data</button>
  `;
}

function onBudgetInput(v) {
  data.totalBudget = Number(v) || 0;
  updateStats();
}

function onBudgetChange(v) {
  data.totalBudget = Number(v) || 0;
  save();
}

function addExpense() {
  const item = document.getElementById('in-item').value.trim();
  const cat = document.getElementById('in-cat').value;
  const amt = Number(document.getElementById('in-amt').value);
  if (!item || !amt) return;
  data.expenses.push({ id: String(Date.now()), item, category: cat, amount: amt, date: new Date().toISOString().slice(0,10) });
  save();
  render();
}

function removeExpense(id) {
  data.expenses = data.expenses.filter(e => String(e.id) !== String(id));
  save();
  render();
}

function resetAll() {
  if (!confirm('Clear your budget and all expenses? This cannot be undone.')) return;
  data = { totalBudget: 0, expenses: [] };
  save();
  render();
}

load();
</script>
</body>
</html>
